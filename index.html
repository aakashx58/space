<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Planet Jumping</title>
<style>
@font-face { font-family: 'SF Pro'; src: local('SF Pro'), local('SF Pro Display'); font-weight: 400; font-style: normal; font-display: swap; }
@font-face { font-family: 'SF Pro'; src: local('SF Pro'), local('SF Pro Display'); font-weight: 700; font-style: normal; font-display: swap; }
@font-face { font-family: 'SF Pro Thin'; src: local('SF Pro Thin'), local('SF Pro Display'); font-weight: 100; font-style: normal; font-display: swap; }
@font-face { font-family: 'Aalto'; src: local('Aalto'), local('Aalto Regular'); font-weight: 400; font-style: normal; font-display: swap; }

:root { font-family: 'SF Pro', Arial, sans-serif; color: #fff; background: #090807; font-synthesis: none; }

* { box-sizing: border-box; }
html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; }

.experience { position: relative; width: 100%; height: 100%; min-height: 540px; overflow: hidden; background: #0a0908; }

.backgrounds, .background, .shade, .transition-layer, .transition-layer video { position: absolute; inset: 0; width: 100%; height: 100%; }
.background { object-fit: cover; opacity: 0; transition: opacity .8s ease; }
.background.is-visible { opacity: 1; }
.shade { z-index: 1; background: linear-gradient(to bottom, transparent 52%, rgba(0,0,0,.88) 100%); pointer-events: none; }

.chrome { position: absolute; z-index: 4; transition: opacity .45s ease, filter .45s ease; }
.experience.is-transitioning .chrome { opacity: 0; filter: blur(8px); pointer-events: none; }

.header { left: clamp(18px, 1.95vw, 28px); right: clamp(18px, 1.95vw, 28px); top: clamp(18px, 3.1vh, 28px); display: flex; justify-content: space-between; align-items: center; }
.header-actions { margin-left: auto; display: flex; align-items: center; }
.nav { display: flex; align-items: center; height: 42px; padding: 4px 5px; border: 1px solid rgba(255,255,255,.45); background: rgba(255,255,255,.1); backdrop-filter: blur(12px); border-radius: 999px; }
.nav a { color: #fff; text-decoration: none; padding: 8px 19px; border-radius: 999px; line-height: 1; }
.nav a.active { background: #fff; color: #000; }
.menu { height: 42px; padding: 0 20px; border: 0; border-radius: 999px; background: #fff; color: #000; cursor: pointer; }

.planet-list { left: clamp(18px, 1.95vw, 28px); top: 50%; transform: translateY(-43%); display: flex; flex-direction: column; gap: 6px; font-size: 16px; }
.planet-item { display: flex; align-items: center; min-height: 20px; }
.planet-item.active { font-size: 18px; font-weight: 700; gap: 8px; }
.planet-item.active:before { content: ''; width: 16px; height: 16px; border-radius: 50%; background: #fff; }

.portal-wrap { left: 50%; top: 50%; width: min(320px, 31vw); transform: translate(-50%, -54%); perspective: none; }
.portal-heading { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; font-size: 16px; opacity: 0; }
.portal-heading strong { font-size: 18px; margin-left: 8px; }
.portal { position: relative; display: block; width: 100%; aspect-ratio: 320/350; padding: 0; overflow: visible; border: 0; border-radius: 90px; background: transparent; cursor: pointer; box-shadow: none; transform: none !important; }
.portal video, .portal img { visibility: hidden; position: absolute; width: 1px; height: 1px; pointer-events: none; }
.portal-canvas { position: fixed; inset: 0; z-index: 3; width: 100%; height: 100%; pointer-events: none; }

.planet-content { left: clamp(28px, 4vw, 58px); right: clamp(28px, 3vw, 44px); bottom: clamp(24px, 3vh, 30px); display: flex; justify-content: space-between; align-items: flex-end; gap: 40px; }
.planet-content h1 { font-family: Aalto, 'Arial Narrow', sans-serif; font-size: clamp(128px, 21.8vw, 314px); font-weight: 400; line-height: .72; margin: 0 0 -.04em; letter-spacing: 0; transform: translateX(-32px); opacity: 0; }
.planet-content dl { width: min(447px, 34vw); margin: 0; font-size: 16px; }
.fact { display: grid; grid-template-columns: 138px 1fr; gap: 18px; padding: 8px 0; border-bottom: 1px solid rgba(255,255,255,.48); opacity: 0; }
.fact:last-child { border-bottom: 0; }
.fact dt { font-weight: 700; }
.fact dd { margin: 0; }

.transition-layer { display: none; }
.scene-canvas { display: none; }
.loading { position: absolute; z-index: 12; left: 50%; bottom: 30px; transform: translateX(-50%); opacity: 0; font-size: 12px; letter-spacing: .14em; text-transform: uppercase; transition: opacity .2s; }
.experience.is-loading .loading { opacity: .8; }
.experience.is-transitioning .header, .experience.is-transitioning .planet-list { opacity: 1; filter: none; pointer-events: auto; }
.experience.is-transitioning .shade { opacity: 1; }
.experience.is-committing .background { transition: none !important; }

.preloader { position: absolute; inset: 0; z-index: 20; background: #000; overflow: hidden; }
.preloader video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.preloader-shade { position: absolute; inset: auto 0 0; height: 35%; background: linear-gradient(to bottom, transparent, #000); }
.preloader.is-background { z-index: 0; }
.preloader.is-background .preloader-shade { opacity: 0; }

.floating-logo { position: fixed; z-index: 22; left: 50%; top: 50%; width: 59px; height: 58px; transform: translate(-50%, -50%); will-change: left, top, width, height, transform; transition: left 2s cubic-bezier(.16,1,.3,1), top 2s cubic-bezier(.16,1,.3,1), width 2s cubic-bezier(.16,1,.3,1), height 2s cubic-bezier(.16,1,.3,1), transform 2s cubic-bezier(.16,1,.3,1); }
.floating-logo.is-docked { left: clamp(18px, 1.95vw, 28px); top: clamp(18px, 3.1vh, 28px); width: 37px; height: 36px; transform: none; }
.floating-logo.is-settled { z-index: 5; }

.preloader-count { position: fixed; z-index: 22; left: 50%; bottom: clamp(22px, 3.1vh, 28px); display: flex; align-items: flex-end; gap: 4px; transform: translateX(-50%); font-family: 'SF Pro', Arial, sans-serif; line-height: 1; }
.preloader-count > span:first-child { font-family: 'SF Pro Thin', 'SF Pro', Arial, sans-serif; font-size: 64px; font-weight: 100; }
.preloader-count .percent { font-size: 24px; padding-bottom: 4px; }
.preloader-count.is-leaving { animation: preload-count-out .75s cubic-bezier(.22,1,.36,1) both; }
@keyframes preload-count-out { to { opacity: 0; filter: blur(7px); transform: translate(-50%, -34px); } }

body:not(.preload-complete) .custom-cursor { opacity: 0 !important; }

.custom-cursor { display: block; position: fixed; left: 0; top: 0; z-index: 100; width: 1px; height: 1px; pointer-events: none; opacity: 0; transition: opacity .2s ease; }
.custom-cursor.is-visible { opacity: 1; }
.cursor-dot, .cursor-orbit { position: absolute; left: 0; top: 0; border-radius: 50%; transform: translate(-50%, -50%); }
.cursor-dot { width: 12px; height: 12px; background: #fff; }
.cursor-orbit { width: 36px; height: 36px; border: 1px solid #fff; background: rgba(255,255,255,.4); transition: transform .3s cubic-bezier(.22,1,.36,1); }
.custom-cursor.is-enter .cursor-orbit { transform: translate(-50%, -50%) scale(1.16); }
.cursor-label { position: absolute; top: 26px; left: 0; transform: translateX(-50%) translateY(-4px); font: 16px/1.2 'SF Pro', Arial, sans-serif; white-space: nowrap; opacity: 0; transition: opacity .2s ease, transform .3s cubic-bezier(.22,1,.36,1); }
.custom-cursor.is-enter .cursor-label { opacity: 1; transform: translateX(-50%) translateY(0); }

html, body, button, a, .portal { cursor: none !important; }

body:not(.intro-ready) .header, body:not(.intro-ready) .planet-list, body:not(.intro-ready) .planet-content h1, body:not(.intro-ready) .planet-content .fact { opacity: 0; }
.intro-ready .header { animation: reveal-down .9s cubic-bezier(.22,1,.36,1) .1s both; }
.intro-ready .planet-list { animation: reveal-side .9s cubic-bezier(.22,1,.36,1) .65s both; }
.content-revealing h1 { animation: title-rise 1.05s cubic-bezier(.16,1,.3,1) both; }
.content-revealing .fact { animation: fact-rise .72s cubic-bezier(.22,1,.36,1) both; }
.content-revealing .fact:nth-child(1) { animation-delay: .52s; }
.content-revealing .fact:nth-child(2) { animation-delay: .68s; }
.content-revealing .fact:nth-child(3) { animation-delay: .84s; }
.content-revealing .fact:nth-child(4) { animation-delay: 1s; }
.mask-revealing .portal-heading { animation: portal-caption .85s cubic-bezier(.22,1,.36,1) both; }
.planet-list.is-switching .planet-item { animation: menu-row .58s cubic-bezier(.22,1,.36,1) both; }
.planet-list.is-switching .planet-item:nth-child(1) { animation-delay: .02s; }
.planet-list.is-switching .planet-item:nth-child(2) { animation-delay: .05s; }
.planet-list.is-switching .planet-item:nth-child(3) { animation-delay: .08s; }
.planet-list.is-switching .planet-item:nth-child(4) { animation-delay: .11s; }
.planet-list.is-switching .planet-item:nth-child(5) { animation-delay: .14s; }
.planet-list.is-switching .planet-item:nth-child(6) { animation-delay: .17s; }
.planet-list.is-switching .planet-item:nth-child(7) { animation-delay: .2s; }
.planet-list.is-switching .planet-item:nth-child(8) { animation-delay: .23s; }
.planet-list.is-switching .planet-item.active:before { animation: active-dot .55s cubic-bezier(.22,1,.36,1) .18s both; }

@keyframes reveal-down { from { opacity: 0; filter: blur(8px); transform: translateY(-18px); } to { opacity: 1; filter: blur(0); transform: translateY(0); } }
@keyframes reveal-side { from { opacity: 0; filter: blur(8px); transform: translate(-20px, -43%); } to { opacity: 1; filter: blur(0); transform: translate(0, -43%); } }
@keyframes title-rise { from { opacity: 0; filter: blur(12px); transform: translate(-32px, 42px); } to { opacity: 1; filter: blur(0); transform: translate(-32px, 0); } }
@keyframes fact-rise { from { opacity: 0; filter: blur(7px); transform: translateY(18px); } to { opacity: 1; filter: blur(0); transform: translateY(0); } }
@keyframes portal-caption { from { opacity: 0; filter: blur(7px); transform: translateY(22px); } to { opacity: 1; filter: blur(0); transform: translateY(0); } }
@keyframes menu-row { from { opacity: .35; transform: translateX(-8px); } to { opacity: 1; transform: translateX(0); } }
@keyframes active-dot { from { opacity: 0; transform: scale(0); } to { opacity: 1; transform: scale(1); } }

@media (max-width: 900px) {
  .nav { display: none; }
  .portal-wrap { width: min(300px, 48vw); }
  .planet-content h1 { font-size: clamp(105px, 24vw, 190px); }
  .planet-content dl { width: 43vw; }
  .fact { grid-template-columns: 110px 1fr; }
  .planet-list { font-size: 14px; }
  .planet-item.active { font-size: 16px; }
}
@media (max-width: 640px) {
  .experience { min-height: 600px; }
  .planet-list { display: none; }
  .portal-wrap { top: 44%; width: min(260px, 66vw); }
  .planet-content { left: 18px; right: 18px; bottom: 18px; display: block; }
  .planet-content h1 { font-size: clamp(98px, 30vw, 160px); margin-bottom: 20px; }
  .planet-content dl { width: 100%; font-size: 13px; }
  .fact { grid-template-columns: 92px 1fr; padding: 5px 0; }
  .portal-heading { font-size: 14px; }
  .portal-heading strong { font-size: 16px; }
  .menu { height: 38px; }
  .portal { border-radius: 70px; }
}
@media (prefers-reduced-motion: reduce) {
  * { transition-duration: .01ms !important; }
  .portal { transform: none !important; }
}
</style>

<script>
const BASE = 'https://d2ol7oe51mr4n9.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P';
const MARS_BG = BASE + '/3c83091e-4046-4fd6-adbb-2edb728be79a.mp4';
const TO_EARTH = BASE + '/fc3ded42-e845-41f3-a830-5cab512d79cd.mp4';
const TO_VENUS = BASE + '/b30f64d9-1637-477a-83df-d0fc6461a422.mp4';
const TO_MARS = BASE + '/5fc5651c-3b5d-4171-b507-87f7e635d1b4.mp4';
const MERCURY = BASE + '/d6fb8b6b-c15e-4aaa-9cf7-45bbb5e33372.jpg';
const LOGO = BASE + '/eb7e0f53-50cd-4af5-abc4-8b9a52cdc01b.svg';

const planets = ['Mercury','Venus','Earth','Mars','Jupiter','Saturn','Uranus','Neptune'];

const states = {
  mars:  { name:'Mars',  next:'Earth',   number:'[03]', portal:TO_EARTH,  background:'mars-background',
    facts:[['Distance:','About 228 million km (1.5 astronomical units).'],
           ['Year:','One Martian year is equal to 687 Earth days.'],
           ['Temperature:','Around -60 °C, dropping to -125 °C at the poles in winter.'],
           ['Atmosphere:','Very thin, consisting of 95% carbon dioxide, with frequent dust storms.']] },
  earth: { name:'Earth', next:'Venus',   number:'[02]', portal:TO_VENUS,  background:'earth-background',
    facts:[['Distance:','149.6 million km from the Sun.'],
           ['Year:','365.25 Earth days.'],
           ['Temperature:','Average surface temperature around 15 °C.'],
           ['Atmosphere:','Mostly nitrogen and oxygen, supporting life and liquid water.']] },
  venus: { name:'Venus', next:'Mercury', number:'[06]', image:MERCURY,    background:'venus-background',
    facts:[['Distance:','108.2 million km from the Sun.'],
           ['Year:','225 Earth days.'],
           ['Temperature:','Around 465 °C — the hottest planet in the Solar System.'],
           ['Atmosphere:','Extremely dense, mostly carbon dioxide, with clouds of sulfuric acid.']] }
};

let current = 'mars';
let busy = false;
let isFirstRender = true;

const experience = document.querySelector('.experience');
const preloader = document.getElementById('preloader');
const preloaderVideo = document.getElementById('preloader-video');
const preloaderValue = document.getElementById('preloader-value');
const preloaderCount = document.getElementById('preloader-count');
const floatingLogo = document.getElementById('floating-logo');
const floatingLogoEl = floatingLogo;
const planetTitle = document.getElementById('planet-title');
const nextNumber = document.getElementById('next-number');
const nextName = document.getElementById('next-name');
const portalBtn = document.getElementById('portal');
const portalVideo = document.getElementById('portal-video');
const portalImage = document.getElementById('portal-image');
const factsEl = document.getElementById('facts');
const planetList = document.querySelector('.planet-list');
const portalCanvas = document.getElementById('portal-canvas');
const sceneCanvas = document.getElementById('scene-canvas');
const transitionVideo = document.getElementById('transition-video');
const customCursor = document.querySelector('.custom-cursor');
const cursorOrbit = customCursor.querySelector('.cursor-orbit');
const cursorDot = customCursor.querySelector('.cursor-dot');

const portalCtx = portalCanvas.getContext('2d');
const sceneCtx = sceneCanvas.getContext('2d');

let expansion = 0;
let maskScale = 1;
let canvasOpacity = 1;
let rotX = 0, rotY = 0;
let targetX = 0, targetY = 0;
let transitionActive = false;
let frozenScene = null;
let lastFrameTime = 0;
let cursorX = 0, cursorY = 0;
let cursorTargetX = 0, cursorTargetY = 0;
let cursorVisible = false;
let preloaderFinished = false;

function resizeCanvas() {
  const d = Math.min(window.devicePixelRatio || 1, 2);
  portalCanvas.width = innerWidth * d;
  portalCanvas.height = innerHeight * d;
  portalCanvas.style.width = innerWidth + 'px';
  portalCanvas.style.height = innerHeight + 'px';
  portalCtx.setTransform(d, 0, 0, d, 0, 0);

  if (!frozenScene) {
    sceneCanvas.width = innerWidth * d;
    sceneCanvas.height = innerHeight * d;
    sceneCanvas.style.width = innerWidth + 'px';
    sceneCanvas.style.height = innerHeight + 'px';
    sceneCtx.setTransform(d, 0, 0, d, 0, 0);
  }
}

function drawCover(ctx, media) {
  const mw = media.videoWidth || media.naturalWidth || 1;
  const mh = media.videoHeight || media.naturalHeight || 1;
  const scale = Math.max(innerWidth / mw, innerHeight / mh);
  const w = mw * scale;
  const h = mh * scale;
  const x = (innerWidth - w) / 2;
  const y = (innerHeight - h) / 2;
  ctx.drawImage(media, x, y, w, h);
}

function buildRoundedRectPath(w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  const points = [];
  const steps = 10;

  const corners = [
    { cx: w/2 - r, cy: -h/2 + r, start: -Math.PI/2, end: 0 },
    { cx: w/2 - r, cy: h/2 - r, start: 0, end: Math.PI/2 },
    { cx: -w/2 + r, cy: h/2 - r, start: Math.PI/2, end: Math.PI },
    { cx: -w/2 + r, cy: -h/2 + r, start: Math.PI, end: Math.PI * 1.5 }
  ];

  for (const c of corners) {
    for (let i = 0; i <= steps; i++) {
      const a = c.start + (c.end - c.start) * (i / steps);
      points.push({ x: c.cx + r * Math.cos(a), y: c.cy + r * Math.sin(a) });
    }
  }
  return points;
}

function projectPoints(points, rx, ry, cx, cy) {
  const ax = rx * Math.PI / 180;
  const ay = ry * Math.PI / 180;
  const cosAx = Math.cos(ax), sinAx = Math.sin(ax);
  const cosAy = Math.cos(ay), sinAy = Math.sin(ay);
  const focal = 850;
  const projected = [];
  for (const p of points) {
    const xx = p.x * cosAy;
    const z = p.x * sinAy - p.y * sinAx;
    const yy = p.y * cosAx;
    const persp = focal / (focal + z);
    projected.push({ x: cx + xx * persp, y: cy + yy * persp });
  }
  return projected;
}

function drawShade(ctx) {
  const grad = ctx.createLinearGradient(0, innerHeight * 0.52, 0, innerHeight);
  grad.addColorStop(0, 'rgba(0,0,0,0)');
  grad.addColorStop(1, 'rgba(0,0,0,0.88)');
  ctx.fillStyle = grad;
  ctx.fillRect(0, innerHeight * 0.52, innerWidth, innerHeight * 0.48);
}

function draw(now) {
  const dt = Math.min(now - lastFrameTime, 40);
  lastFrameTime = now;

  portalCtx.clearRect(0, 0, innerWidth, innerHeight);

  if (frozenScene) {
    portalCtx.drawImage(sceneCanvas, 0, 0, innerWidth, innerHeight);
    drawShade(portalCtx);
  }

  const rect = portalBtn.getBoundingClientRect();
  const e = expansion;
  const cx = rect.left + rect.width / 2 + (innerWidth / 2 - (rect.left + rect.width / 2)) * e;
  const cy = rect.top + rect.height / 2 + (innerHeight / 2 - (rect.top + rect.height / 2)) * e;
  const baseW = rect.width + (innerWidth - rect.width) * e;
  const baseH = rect.height + (innerHeight - rect.height) * e;
  const scale = e ? 1 : maskScale;
  const w = baseW * scale;
  const h = baseH * scale;
  const r = 90 * (1 - e) * scale;
  const rx = rotX * (1 - e);
  const ry = rotY * (1 - e);

  if (w > 1 && h > 1) {
    const localPoints = buildRoundedRectPath(w, h, r);
    const screenPoints = projectPoints(localPoints, rx, ry, cx, cy);

    portalCtx.save();
    portalCtx.globalAlpha = canvasOpacity;
    portalCtx.beginPath();
    portalCtx.moveTo(screenPoints[0].x, screenPoints[0].y);
    for (let i = 1; i < screenPoints.length; i++) {
      portalCtx.lineTo(screenPoints[i].x, screenPoints[i].y);
    }
    portalCtx.closePath();
    portalCtx.clip();

    portalCtx.fillStyle = '#030303';
    portalCtx.fillRect(0, 0, innerWidth, innerHeight);

    const state = states[current];
    const media = transitionActive ? transitionVideo : (state.image ? portalImage : portalVideo);
    if (media.readyState >= 2 || media.complete) {
      drawCover(portalCtx, media);
    }

    if (transitionActive) {
      drawShade(portalCtx);
    }
    portalCtx.restore();
  }

  rotX += (targetX - rotX) * Math.min(1, dt * 0.009);
  rotY += (targetY - rotY) * Math.min(1, dt * 0.009);

  requestAnimationFrame(draw);
}

function render() {
  const state = states[current];
  experience.dataset.planet = current;
  planetTitle.textContent = state.name.toUpperCase();
  nextNumber.textContent = state.number;
  nextName.textContent = state.name;
  portalBtn.setAttribute('aria-label', `Travel to ${state.next}`);

  factsEl.innerHTML = state.facts.map(([k, v]) => `<div class="fact"><dt>${k}</dt><dd>${v}</dd></div>`).join('');

  planetList.innerHTML = planets.map(p => {
    const isActive = p.toLowerCase() === current;
    return `<span class="planet-item${isActive ? ' active' : ''}">${p}</span>`;
  }).join('');

  if (!isFirstRender) {
    planetList.classList.remove('is-switching');
    planetList.offsetWidth;
    planetList.classList.add('is-switching');
  }
  isFirstRender = false;

  document.querySelectorAll('.background').forEach(v => v.classList.toggle('is-visible', v.id === state.background));

  const hasImage = 'image' in state;
  portalImage.style.display = hasImage ? 'block' : 'none';
  portalVideo.style.display = hasImage ? 'none' : 'block';
  if (!hasImage && portalVideo.src !== state.portal) {
    portalVideo.src = state.portal;
    portalVideo.load();
  }
}

function easeInOutCubic(t) {
  return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
}

function animateValue(setter, duration) {
  return new Promise(resolve => {
    const start = performance.now();
    function step(now) {
      const t = Math.min(1, (now - start) / duration);
      const eased = easeInOutCubic(t);
      setter(eased);
      if (t < 1) requestAnimationFrame(step);
      else resolve();
    }
    requestAnimationFrame(step);
  });
}

function waitForVideoReady(video, timeout = 1600) {
  return new Promise((resolve, reject) => {
    if (video.readyState >= 3) return resolve();
    const timer = setTimeout(() => {
      cleanup();
      resolve();
    }, timeout);
    function onReady() { cleanup(); resolve(); }
    function onError() { cleanup(); resolve(); }
    function cleanup() {
      clearTimeout(timer);
      video.removeEventListener('canplaythrough', onReady);
      video.removeEventListener('error', onError);
    }
    video.addEventListener('canplaythrough', onReady, { once: true });
    video.addEventListener('error', onError, { once: true });
  });
}

async function revealMask() {
  experience.classList.remove('mask-revealing');
  experience.offsetWidth;
  experience.classList.add('mask-revealing');
  maskScale = 0;
  return animateValue(v => maskScale = v, 1050);
}

function revealPlanetContent() {
  experience.classList.remove('content-revealing');
  experience.offsetWidth;
  experience.classList.add('content-revealing');
}

async function travel() {
  if (busy || current === 'venus') return;
  busy = true;
  targetX = targetY = 0;

  const state = states[current];
  const next = current === 'mars' ? 'earth' : 'venus';

  transitionVideo.src = state.portal;
  transitionVideo.load();
  experience.classList.add('is-loading');

  await waitForVideoReady(transitionVideo);

  experience.classList.remove('is-loading', 'content-revealing', 'mask-revealing');
  experience.classList.add('is-transitioning');

  transitionVideo.currentTime = 0;
  transitionVideo.playbackRate = 1.3;
  canvasOpacity = 1;
  transitionActive = true;
  await transitionVideo.play().catch(() => {});

  await animateValue(v => expansion = v, 1100);

  await new Promise(resolve => {
    function onEnded() {
      transitionVideo.removeEventListener('ended', onEnded);
      resolve();
    }
    transitionVideo.addEventListener('ended', onEnded, { once: true });
  });

  sceneCanvas.width = innerWidth * Math.min(window.devicePixelRatio || 1, 2);
  sceneCanvas.height = innerHeight * Math.min(window.devicePixelRatio || 1, 2);
  sceneCanvas.style.width = innerWidth + 'px';
  sceneCanvas.style.height = innerHeight + 'px';
  sceneCtx.setTransform(Math.min(window.devicePixelRatio || 1, 2), 0, 0, Math.min(window.devicePixelRatio || 1, 2), 0, 0);
  sceneCtx.clearRect(0, 0, innerWidth, innerHeight);
  drawCover(sceneCtx, transitionVideo);
  frozenScene = true;

  current = next;
  experience.classList.add('is-committing');
  render();

  await new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r)));

  transitionActive = false;
  expansion = 0;
  maskScale = 0;
  canvasOpacity = 1;
  experience.classList.remove('is-transitioning', 'is-committing');

  const maskReveal = revealMask();
  setTimeout(revealPlanetContent, 100);
  await maskReveal;

  setTimeout(() => {
    transitionVideo.src = '';
    transitionVideo.load();
    busy = false;
  }, 450);
}

function runPreloader() {
  let finished = false;
  function finish() {
    if (finished) return;
    finished = true;
    preloaderFinished = true;
    preloaderValue.textContent = '100';
    preloaderCount.classList.add('is-leaving');
    floatingLogoEl.classList.add('is-docked');
    preloader.classList.add('is-background');
    document.body.classList.add('preload-complete');

    startExperience();

    setTimeout(() => preloaderCount.style.display = 'none', 750);
    setTimeout(() => floatingLogoEl.classList.add('is-settled'), 2000);
  }

  preloaderVideo.addEventListener('loadedmetadata', () => {
    const rate = Math.max(0.25, preloaderVideo.duration / 3);
    preloaderVideo.playbackRate = rate;
    preloaderVideo.play().catch(finish);
  }, { once: true });

  preloaderVideo.addEventListener('ended', finish, { once: true });

  function updateCounter() {
    if (finished) return;
    const pct = Math.round(preloaderVideo.currentTime / preloaderVideo.duration * 100);
    preloaderValue.textContent = String(Math.min(100, pct));
    requestAnimationFrame(updateCounter);
  }
  requestAnimationFrame(updateCounter);
}

async function startExperience() {
  const state = states[current];
  const media = state.image ? portalImage : portalVideo;
  await new Promise(resolve => {
    if (media.readyState >= 2 || media.complete) return resolve();
    media.addEventListener('canplaythrough', resolve, { once: true });
    media.addEventListener('error', resolve, { once: true });
  });
  await revealMask();
  document.body.classList.add('intro-ready');
  setTimeout(revealPlanetContent, 850);
}

function cursorLoop() {
  cursorX += (cursorTargetX - cursorX) * 0.2;
  cursorY += (cursorTargetY - cursorY) * 0.2;
  customCursor.style.transform = `translate3d(${cursorX}px, ${cursorY}px, 0)`;
  requestAnimationFrame(cursorLoop);
}

document.addEventListener('pointermove', e => {
  if (!cursorVisible) {
    cursorVisible = true;
    customCursor.classList.add('is-visible');
  }
  cursorTargetX = e.clientX;
  cursorTargetY = e.clientY;
  if (!busy) {
    targetY = (e.clientX / innerWidth - 0.5) * 37.4;
    targetX = (e.clientY / innerHeight - 0.5) * -33;
  }
});

document.addEventListener('mouseleave', () => {
  customCursor.classList.remove('is-visible');
  cursorVisible = false;
  targetX = targetY = 0;
});

portalBtn.addEventListener('pointerenter', () => customCursor.classList.add('is-enter'));
portalBtn.addEventListener('pointerleave', () => customCursor.classList.remove('is-enter'));
portalBtn.addEventListener('click', travel);

window.addEventListener('resize', resizeCanvas);

document.querySelectorAll('.background').forEach(v => { v.pause(); v.currentTime = 0; });
resizeCanvas();
render();
requestAnimationFrame(draw);
requestAnimationFrame(cursorLoop);
runPreloader();
</script>
</body>
</html>
